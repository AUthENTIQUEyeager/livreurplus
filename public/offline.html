<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LivreurPlus — Hors ligne</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: linear-gradient(135deg, #12A38E, #0B5C51);
    color: #fff;
  }
  .wrap {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 32px;
    box-sizing: border-box;
  }
  img { width: 72px; height: 72px; border-radius: 18px; margin-bottom: 20px; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { font-size: 14px; opacity: 0.85; margin: 0 0 24px; max-width: 320px; }
  button {
    background: #fff;
    color: #0B5C51;
    border: none;
    border-radius: 12px;
    padding: 12px 24px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
</style>
</head>
<body>
  <div class="wrap">
    <img src="/icons/icon-192.png" alt="LivreurPlus" />
    <h1>Pas de connexion</h1>
    <p>Cette page a besoin d'internet pour se charger. Reconnecte-toi puis réessaie.</p>
    <button onclick="location.reload()">Réessayer</button>
  </div>
</body>
</html>
